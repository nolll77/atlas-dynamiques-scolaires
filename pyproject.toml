[project]
name = "atlas-dynamiques-scolaires"
version = "0.1.0"
description = "Vers un Atlas des Dynamiques Scolaires — Infrastructure ouverte de recherche computationnelle"
authors = [{ name = "Noël Ching" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "pandas>=2.2",
  "pyarrow>=15.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "folium>=0.16",
  "contextily>=1.5",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "ruptures>=1.1",
  "hmmlearn>=0.3",
  "pysal>=23.0",
  "libpysal>=4.10",
  "networkx>=3.3",
  "python-louvain>=0.16",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
  "kaleido>=0.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "rich>=13.0",
  "typer>=0.12",
  "mlflow>=2.11",
  "dvc>=3.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "W", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/atlas --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
